name: Feature request
description: Propose a focused and safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed operator workflow
    validations:
      required: true
  - type: textarea
    attributes:
      label: Carrier, submission, SMS, credential, and compatibility impact
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and removed account-specific data.
          required: true
