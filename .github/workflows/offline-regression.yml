name: Offline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pure receipt and state tests (no browser or credentials)
        run: node --test tests/sms-receipt-boundary.test.js tests/sms-inbox-client.test.js tests/sms-parser.test.js tests/config.test.js tests/package-gate.test.js tests/run-log-outcome.test.js tests/sync-claim-state.test.js tests/create-failure-issue.test.js tests/resolve-failure-issue.test.js tests/state-workflow-integration.test.js tests/offer-inventory.test.js tests/slider-vision.test.js
