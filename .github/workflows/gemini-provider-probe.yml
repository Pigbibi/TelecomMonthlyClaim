name: Gemini synthetic provider check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gemini-synthetic-provider-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic image and simulated model retirement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
        run: node scripts/gemini-provider-probe.cjs
