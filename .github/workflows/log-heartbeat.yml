name: Repository Log Heartbeat

on:
  schedule:
    # Beijing time 07:17 every Monday.
    - cron: "17 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-log-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Record heartbeat on logs branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LOG_KIND: heartbeat
          RUN_LOG_STATUS: success
          RUN_LOG_CLAIM_OUTCOME: not_applicable
        run: bash scripts/write-run-log-branch.sh
