name: Monthly Beijing Telecom Claim

on:
  schedule:
    # Beijing time 08:00 on day 1-3 each month.
    - cron: "0 0 1-3 * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignore monthly success state and run anyway"
        required: false
        default: "false"
      dry_run:
        description: "Stop before the final telecom submit button"
        required: false
        default: "false"
      connectivity_mode:
        description: "Network mode: auto prefers configured proxy, otherwise direct"
        required: false
        default: "auto"
      probe_only:
        description: "Load the entry page and login slider without submitting it or sending SMS"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: monthly-beijing-telecom-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELECOM_PHONE: ${{ secrets.TELECOM_PHONE }}
      TELECOM_ENTRY_URL: ${{ secrets.TELECOM_ENTRY_URL || vars.TELECOM_ENTRY_URL || '' }}
      TELECOM_ENTRY_REQUIRED_PARAMS: ${{ vars.TELECOM_ENTRY_REQUIRED_PARAMS || 'campaignId,channelId,wxopenid' }}
      TELECOM_EXPECTED_CHANNEL_ID: ${{ vars.TELECOM_EXPECTED_CHANNEL_ID || '' }}
      TELECOM_TARGET_PACKAGE: ${{ vars.TELECOM_TARGET_PACKAGE || 'voice200' }}
      TELECOM_PRODUCT_NAME: ${{ vars.TELECOM_PRODUCT_NAME || '' }}
      TELECOM_EXPECTED_PLAN_ID: ${{ vars.TELECOM_EXPECTED_PLAN_ID || '' }}
      TELECOM_ACTION_DELAY_MS: ${{ vars.TELECOM_ACTION_DELAY_MS || '' }}
      TELECOM_POST_SUCCESS_WAIT_MS: ${{ vars.TELECOM_POST_SUCCESS_WAIT_MS || '' }}
      TELECOM_CONNECTIVITY_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.connectivity_mode || vars.TELECOM_CONNECTIVITY_MODE || 'auto' }}
      SMS_INBOX_PROVIDER: ${{ vars.SMS_INBOX_PROVIDER || 'pushplus' }}
      SMS_INBOX_URL: ${{ secrets.SMS_INBOX_URL || 'http://127.0.0.1:18787/messages' }}
      SMS_INBOX_HEALTH_URL: ${{ secrets.SMS_INBOX_HEALTH_URL || 'http://127.0.0.1:18787/health' }}
      SMS_INBOX_TOKEN: ${{ secrets.SMS_INBOX_TOKEN }}
      SMS_SENDER: ${{ vars.SMS_SENDER || '10001' }}
      TELECOM_SUCCESS_SMS_SENDER: ${{ vars.TELECOM_SUCCESS_SMS_SENDER || '10000' }}
      TELECOM_SUCCESS_SMS_TIMEOUT_MS: ${{ vars.TELECOM_SUCCESS_SMS_TIMEOUT_MS || '30000' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
      PUSHPLUS_BASE_URL: ${{ vars.PUSHPLUS_BASE_URL || 'https://www.pushplus.plus' }}
      PUSHPLUS_KEYWORD: ${{ vars.PUSHPLUS_KEYWORD || '' }}
      PUSHPLUS_TITLE_KEYWORD: ${{ vars.PUSHPLUS_TITLE_KEYWORD || '' }}
      PUSHPLUS_PAGE_SIZE: ${{ vars.PUSHPLUS_PAGE_SIZE || '10' }}
      PUSHPLUS_DEBUG: ${{ vars.PUSHPLUS_DEBUG || 'false' }}
      PUSHPLUS_RELAY_INBOX_URL: ${{ vars.PUSHPLUS_RELAY_INBOX_URL || '' }}
      PUSHPLUS_RELAY_INBOX_TOKEN: ${{ secrets.PUSHPLUS_RELAY_INBOX_TOKEN }}
      TELECOM_VISION_FALLBACK: ${{ vars.TELECOM_VISION_FALLBACK || 'true' }}
      # When the repo var is unset, FALLBACK defaults to true above; gate secrets the same way.
      GEMINI_API_KEY: ${{ (vars.TELECOM_VISION_FALLBACK || 'true') == 'true' && secrets.GEMINI_API_KEY || '' }}
      TELECOM_VISION_URL: ${{ (vars.TELECOM_VISION_FALLBACK || 'true') == 'true' && (vars.TELECOM_VISION_URL || 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent') || '' }}
      TELECOM_VISION_MODE: ${{ (vars.TELECOM_VISION_FALLBACK || 'true') == 'true' && (vars.TELECOM_VISION_MODE || 'gemini') || '' }}
      TELECOM_VISION_MODEL: ${{ (vars.TELECOM_VISION_FALLBACK || 'true') == 'true' && (vars.TELECOM_VISION_MODEL || 'gemini-3.6-flash') || '' }}
      SEND_CODE_ATTEMPTS: "1"
      SMS_TIMEOUT_MS: ${{ vars.SMS_TIMEOUT_MS || '' }}
      SMS_POLL_MS: ${{ vars.SMS_POLL_MS || '' }}
      PROXY_POOL_HTTP_PROXY: ${{ secrets.PROXY_POOL_HTTP_PROXY || secrets.PUBLIC_HTTP_PROXY || '' }}
      OPENWRT_HTTP_PROXY: ${{ secrets.OPENWRT_HTTP_PROXY || secrets.HOME_HTTP_PROXY || secrets.PUBLIC_HTTP_PROXY || secrets.SCHWAB_PROXY_URL || secrets.BROWSER_PROXY_SERVER || '' }}
      HEADLESS: "false"
      BROWSER_CHANNEL: chrome
      TELECOM_BROWSER_TRANSPORT: "native_playwright"
      TELECOM_BROWSER_PROFILE: "desktop"
      BROWSER_CDP_URL: "http://127.0.0.1:9222"
      TELECOM_STEALTH_MODE: "false"
      TELECOM_MINIMAL_LOGIN: "true"
      TELECOM_SKIP_ORIGIN_WARMUP: "true"
      TELECOM_CDP_PROFILE_MODE: "native"
      TELECOM_REQUIRE_REAL_CHROME: "true"
      TELECOM_FORCE_FRESH_CDP_SESSION: "true"
      TELECOM_REUSE_CDP_PROFILE: "true"
      TELECOM_CLEAR_BROWSER_DATA: "true"
      TELECOM_SLIDER_MODE: "api"
      TELECOM_USE_DEFAULT_CHROME: "0"
      TELECOM_DISABLE_CHROME_EXTENSIONS: "true"
      TELECOM_KEEP_VALIDATED_PAGE_OPEN: "true"
      TELECOM_REUSE_VALIDATED_PAGE: "true"
      TELECOM_PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
      ALLOW_DIRECT_PROXY_FALLBACK: ${{ vars.ALLOW_DIRECT_PROXY_FALLBACK || 'false' }}
      FAIL_ONLY_FINAL_DAY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
      DRY_RUN_BEFORE_FINAL_SUBMIT: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Restore monthly state from logs branch
        id: state_restore
        run: node scripts/sync-claim-state.js restore

      - name: Decide whether claim is needed
        id: claim_plan
        run: node scripts/plan-claim.js

      - if: steps.claim_plan.outputs.should_run == 'true'
        name: Install Google Chrome for real-browser CDP
        run: |
          set -euo pipefail
          # Prefer real Google Chrome over Playwright-bundled Chromium.
          if command -v google-chrome-stable >/dev/null 2>&1 || command -v google-chrome >/dev/null 2>&1; then
            echo "Google Chrome already installed"
          else
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          google-chrome --version || google-chrome-stable --version
          xvfb-run --help >/dev/null

      - name: Validate connectivity
        if: steps.claim_plan.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if [ "${TELECOM_CONNECTIVITY_MODE:-auto}" = "auto" ]; then
            if [ -n "${OPENWRT_HTTP_PROXY:-}" ]; then
              TELECOM_CONNECTIVITY_MODE=http_proxy
            elif [ -n "${PROXY_POOL_HTTP_PROXY:-}" ]; then
              TELECOM_CONNECTIVITY_MODE=proxy_pool
            else
              TELECOM_CONNECTIVITY_MODE=direct
            fi
            echo "Auto connectivity selected ${TELECOM_CONNECTIVITY_MODE}."
            echo "TELECOM_CONNECTIVITY_MODE=${TELECOM_CONNECTIVITY_MODE}" >> "$GITHUB_ENV"
          fi
          case "${TELECOM_CONNECTIVITY_MODE:-direct}" in
            direct|http_proxy|proxy_pool) ;;
            *)
              echo "::error::Unsupported TELECOM_CONNECTIVITY_MODE: ${TELECOM_CONNECTIVITY_MODE}. Use auto, direct, http_proxy, or proxy_pool."
              exit 1
              ;;
          esac
          sms_provider="$(printf '%s' "${SMS_INBOX_PROVIDER:-pushplus}" | tr '[:upper:]' '[:lower:]')"
          if [ "$sms_provider" = "pushplus" ]; then
            if [ -n "${PUSHPLUS_RELAY_INBOX_URL:-}" ]; then
              : "${PUSHPLUS_RELAY_INBOX_TOKEN:?Missing PUSHPLUS_RELAY_INBOX_TOKEN secret}"
            else
              : "${PUSHPLUS_TOKEN:?Missing PUSHPLUS_TOKEN secret}"
              : "${PUSHPLUS_SECRET_KEY:?Missing PUSHPLUS_SECRET_KEY secret}"
            fi
            echo "Workflow will read SMS from PushPlus; skipping SMS inbox health check."
          else
            : "${SMS_INBOX_TOKEN:?Missing SMS_INBOX_TOKEN secret}"
            case "$SMS_INBOX_URL" in
              http://127.0.0.1:*|https://127.0.0.1:*|http://localhost:*|https://localhost:*)
                echo "SMS_INBOX_URL must be reachable from the GitHub-hosted runner, not the default loopback URL."
                exit 1
                ;;
            esac
            case "$SMS_INBOX_HEALTH_URL" in
              http://127.0.0.1:*|https://127.0.0.1:*|http://localhost:*|https://localhost:*)
                echo "SMS_INBOX_HEALTH_URL must be reachable from the GitHub-hosted runner, not the default loopback URL."
                exit 1
                ;;
            esac
            curl -fsS --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer $SMS_INBOX_TOKEN" "$SMS_INBOX_HEALTH_URL" >/dev/null
          fi
          case "${TELECOM_CONNECTIVITY_MODE:-direct}" in
            direct)
              echo "OPENWRT_HTTP_PROXY=" >> "$GITHUB_ENV"
              ;;
            http_proxy)
              : "${OPENWRT_HTTP_PROXY:?Missing OPENWRT_HTTP_PROXY, HOME_HTTP_PROXY, PUBLIC_HTTP_PROXY, SCHWAB_PROXY_URL, or BROWSER_PROXY_SERVER secret for http_proxy mode}"
              case "$OPENWRT_HTTP_PROXY" in
                http://127.0.0.1:*|http://localhost:*)
                  echo "http_proxy mode requires a proxy reachable from the runner, not a loopback URL. Loopback proxy URLs are not allowed on hosted runners."
                  exit 1
                  ;;
              esac
              curl -sSI --proxy "$OPENWRT_HTTP_PROXY" --connect-timeout 8 --max-time 20 "$PROXY_HEALTH_URL" >/dev/null
              ;;
            proxy_pool)
              : "${PROXY_POOL_HTTP_PROXY:?Missing PROXY_POOL_HTTP_PROXY secret for proxy_pool mode}"
              curl -sSI --proxy "$PROXY_POOL_HTTP_PROXY" --connect-timeout 8 --max-time 20 "$PROXY_HEALTH_URL" >/dev/null
              echo "Proxy pool check passed."
              echo "OPENWRT_HTTP_PROXY=$PROXY_POOL_HTTP_PROXY" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Acquire workflow-scoped SMS intercept lease
        id: intercept_lease
        if: steps.claim_plan.outputs.should_run == 'true' && github.event.inputs.probe_only != 'true'
        run: node scripts/manage-intercept-lease.js acquire telecom-claim-silent

      - name: Run claim via real Chrome CDP
        id: claim
        if: steps.claim_plan.outputs.should_run == 'true'
        run: xvfb-run -a bash scripts/run-real-chrome-claim.sh

      - name: Release workflow-scoped SMS intercept lease
        if: always() && steps.intercept_lease.outcome == 'success'
        continue-on-error: true
        run: node scripts/manage-intercept-lease.js release telecom-claim-silent

      - name: Upload claim debug screenshots
        if: always() && steps.claim_plan.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claim-debug-${{ github.run_id }}
          path: artifacts/claim-debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup Chrome CDP
        if: always()
        run: |
          set +e
          if [ -n "${CHROME_CDP_PID:-}" ]; then
            kill "$CHROME_CDP_PID" 2>/dev/null || true
          fi
          if [ -n "${XVFB_PID:-}" ]; then
            kill "$XVFB_PID" 2>/dev/null || true
          fi
          if [ "${TELECOM_BROWSER_TRANSPORT:-auto}" != "playwright" ] && [ "$(uname -s)" != "Darwin" ]; then
            pkill -f "remote-debugging-port=9222" 2>/dev/null || true
          fi
          pkill -x Xvfb 2>/dev/null || true

      - name: Scan monthly state before publishing
        id: state_scan
        if: always() && steps.state_restore.outcome == 'success' && steps.claim_plan.outcome == 'success' && github.event.inputs.dry_run != 'true' && github.event.inputs.probe_only != 'true' && hashFiles(steps.claim_plan.outputs.state_file) != ''
        uses: QuantStrategyLab/.github/actions/scan-before-publish@925d718e440bd5cc7c4537ffef2fd53a2f0e654d
        with:
          path: ${{ steps.claim_plan.outputs.state_file }}

      - name: Persist monthly state on logs branch
        id: state_persist
        if: always() && steps.state_restore.outcome == 'success' && steps.claim_plan.outcome == 'success' && github.event.inputs.dry_run != 'true' && github.event.inputs.probe_only != 'true' && steps.state_scan.outcome != 'failure' && steps.state_scan.outcome != 'cancelled'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LOG_STATE_FILE: ${{ steps.claim_plan.outputs.state_file }}
        run: bash scripts/write-run-log-branch.sh --state-only

      - name: Create issue for failed step
        if: failure() && github.event.inputs.dry_run != 'true' && github.event.inputs.probe_only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILURE_KIND: ${{ steps.state_restore.outcome == 'failure' && 'state_read' || steps.state_scan.outcome == 'failure' && 'state_persistence' || steps.state_persist.outcome == 'failure' && 'state_persistence' || steps.claim.outcome == 'failure' && 'claim' || 'workflow' }}
        run: node scripts/create-failure-issue.js

      - name: Close resolved failure issue
        if: success() && github.event.inputs.dry_run != 'true' && github.event.inputs.probe_only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-failure-issue.js

      - name: Resolve run log outcome
        id: run_log
        if: always()
        env:
          SHOULD_RUN: ${{ steps.claim_plan.outputs.should_run || 'false' }}
          STATE_FILE: ${{ steps.claim_plan.outputs.state_file || '' }}
          STEP_OUTCOME: ${{ steps.claim.outcome || 'skipped' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || 'false' }}
        run: node scripts/resolve-run-log-outcome.js

      - name: Record run log on logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LOG_STATUS: ${{ job.status }}
          RUN_LOG_CLAIM_OUTCOME: ${{ steps.run_log.outputs.claim_outcome || steps.claim.outcome || 'skipped' }}
          RUN_LOG_FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          RUN_LOG_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash scripts/write-run-log-branch.sh
