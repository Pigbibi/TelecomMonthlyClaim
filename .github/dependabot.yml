version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    # minimatch is transitive (glob); Dependabot cannot cleanly bump it alone.
    ignore:
      - dependency-name: "minimatch"
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
